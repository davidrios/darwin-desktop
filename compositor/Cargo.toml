[package]
name = "compositor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Hyprland-style Wayland compositor for macOS (working title)"
publish = false

# Distributed as a binary: every dependency is pinned exactly.
[dependencies]
smithay = { path = "../build/third_party/smithay", default-features = false, features = ["wayland_frontend", "desktop"] }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", features = ["block2", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-metal = "=0.3.2"
objc2-quartz-core = { version = "=0.3.2", features = ["objc2-metal"] }
objc2-core-foundation = "=0.3.2"
block2 = "=0.6.2"
# Hyprland's Lua config: Lua 5.5, built from the crate's bundled sources.
mlua = { version = "=0.12.2", features = ["lua55", "vendored"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Patched sources (patches/README.md): run scripts/prepare-third-party.sh first.
[patch.crates-io]
reis = { path = "../build/third_party/reis" }
